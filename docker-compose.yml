# memopt local development stack
# Usage: docker-compose up -d
# Access: serving at :8080, control plane at :8765,
#         Grafana at :3000, Prometheus at :9090

services:
  memopt-serving:
    build: .
    image: memopt/serving:dev
    ports:
      - "8080:8080"
    environment:
      - MEMOPT_NODE_ID=dev-node-01
      - REDIS_URL=redis://redis:6379
      - MEMOPT_TRANSPORT=tcp
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - memopt-data:/home/memopt/.memopt
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  memopt-control-plane:
    build: .
    image: memopt/serving:dev
    command:
      - python3
      - -m
      - memopt.control_plane.server
      - --port
      - "8765"
    ports:
      - "8765:8765"
    environment:
      - MEMOPT_NODE_ID=control-plane-01
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://memopt:memopt_dev@postgres/memopt
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - memopt-data:/home/memopt/.memopt
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: memopt
      POSTGRES_USER: memopt
      POSTGRES_PASSWORD: memopt_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memopt"]
      interval: 5s
      timeout: 3s
      retries: 5

  scylladb:
    image: scylladb/scylla:5.4
    command: --developer-mode=1 --smp=1 --memory=512M
    ports:
      - "9042:9042"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.48.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=7d"

  grafana:
    image: grafana/grafana:10.2.0
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=memopt
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  memopt-data:
  redis-data:
  scylla-data:
  postgres-data:
  prometheus-data:
  grafana-data:
