version: '3.8'

services:
  memopt:
    build:
      context: .
      dockerfile: Dockerfile
    image: memopt:latest
    container_name: memopt-inference
    
    # GPU configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all  # Use all available GPUs
              capabilities: [gpu]
    
    # Environment variables
    environment:
      - CUDA_VISIBLE_DEVICES=0  # Use first GPU (change as needed)
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
      - TRANSFORMERS_CACHE=/app/models  # Cache models here
    
    # Volume mounts
    volumes:
      - ./models:/app/models  # Model cache
      - ./outputs:/app/outputs  # Results output
      - ./benchmark.py:/app/benchmark.py  # Mount benchmark (for easy updates)
    
    # Network
    ports:
      - "8000:8000"  # API server (if using FastAPI)
    
    # Resource limits (adjust based on your GPU)
    shm_size: '16gb'  # Shared memory for PyTorch dataloaders
    
    # Interactive mode
    stdin_open: true
    tty: true
    
    # Restart policy
    restart: unless-stopped
    
    # Command (override with docker-compose run)
    command: python3 benchmark.py --model gpt2-xl --mode both --num-prompts 8

# Optional: Add API server service
  memopt-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: memopt:latest
    container_name: memopt-api
    
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    
    environment:
      - CUDA_VISIBLE_DEVICES=0
    
    volumes:
      - ./models:/app/models
    
    ports:
      - "8001:8000"
    
    shm_size: '16gb'
    
    # Run API server
    command: python3 examples/api_server.py
    
    restart: unless-stopped

networks:
  default:
    name: memopt-network