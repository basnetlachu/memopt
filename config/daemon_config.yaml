# memopt daemon configuration
#
# Copy to ~/.memopt/daemon_config.yaml to customize
#

# How often to check GPU processes (seconds)
poll_interval: 5.0

# Number of consecutive stable checks before profiling a process
stability_threshold: 3

# Automatically apply optimizations (default: false for safety)
auto_optimize: false

# Logging level: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# PID file location
pid_file: ~/.memopt/daemon.pid

# Log file location
log_file: ~/.memopt/daemon.log

# Daemon state file (for recovery)
state_file: ~/.memopt/daemon_state.json

# Maximum log file size before rotation (MB)
max_log_size_mb: 50

# Dashboard integration (leave empty to disable)
# dashboard_url: http://localhost:8000

# How often to report metrics to dashboard (seconds)
dashboard_report_interval: 10.0
