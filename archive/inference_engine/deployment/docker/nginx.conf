# NGINX Load Balancer Configuration for MemOpt

events {
    worker_connections 1024;
}

http {
    upstream memopt_backend {
        # Round-robin load balancing across 3 nodes
        server memopt-node1:8081;
        server memopt-node2:8082;
        server memopt-node3:8083;
        
        # Health checks
        keepalive 32;
    }
    
    server {
        listen 80;
        
        location / {
            proxy_pass http://memopt_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            
            # Timeouts for long-running inference
            proxy_connect_timeout 60s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }
        
        # Health check endpoint
        location /health {
            proxy_pass http://memopt_backend/health;
            access_log off;
        }
        
        # Readiness check endpoint
        location /ready {
            proxy_pass http://memopt_backend/ready;
            access_log off;
        }
        
        # Metrics aggregation (Prometheus scrapes all nodes)
        location /metrics {
            proxy_pass http://memopt_backend/metrics;
        }
    }
}
