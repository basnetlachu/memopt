# MemOpt Worker Deployment
# GPU workers for multi-node scaling

apiVersion: v1
kind: ConfigMap
metadata:
  name: memopt-worker-config
  namespace: memopt
data:
  MODEL_NAME: "gpt2"
  OPTIMIZATION_LEVEL: "batch"
  WORKER_PORT: "9000"
  HEALTH_PORT: "8080"
  MEMOPT_MAX_QUEUE: "5000"
  MEMOPT_WORKERS: "1"
  MEMOPT_ENABLE_HEALTH: "true"
  MEMOPT_ENABLE_METRICS: "true"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memopt-worker
  namespace: memopt
  labels:
    app: memopt
    role: worker
spec:
  # Scale horizontally: N replicas = N GPUs
  replicas: 3
  
  selector:
    matchLabels:
      app: memopt
      role: worker
  
  template:
    metadata:
      labels:
        app: memopt
        role: worker
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    
    spec:
      containers:
      - name: worker
        image: memopt:latest
        imagePullPolicy: IfNotPresent
        command: ["python3", "production_worker.py"]
        
        ports:
        - name: infer
          containerPort: 9000
          protocol: TCP
        - name: health
          containerPort: 8080
          protocol: TCP
        
        env:
        # Node identity (unique per pod)
        - name: MEMOPT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        # Role
        - name: MEMOPT_NODE_ROLE
          value: "worker"
        
        # Configuration
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: memopt-worker-config
              key: MODEL_NAME
        
        - name: OPTIMIZATION_LEVEL
          valueFrom:
            configMapKeyRef:
              name: memopt-worker-config
              key: OPTIMIZATION_LEVEL
        
        - name: WORKER_PORT
          valueFrom:
            configMapKeyRef:
              name: memopt-worker-config
              key: WORKER_PORT
        
        - name: HEALTH_PORT
          valueFrom:
            configMapKeyRef:
              name: memopt-worker-config
              key: HEALTH_PORT
        
        - name: MEMOPT_MAX_QUEUE
          valueFrom:
            configMapKeyRef:
              name: memopt-worker-config
              key: MEMOPT_MAX_QUEUE
        
        - name: MEMOPT_ENABLE_HEALTH
          valueFrom:
            configMapKeyRef:
              name: memopt-worker-config
              key: MEMOPT_ENABLE_HEALTH
        
        - name: MEMOPT_ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: memopt-worker-config
              key: MEMOPT_ENABLE_METRICS
        
        # Resource limits (1 GPU per worker)
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        
        # Liveness probe (worker process alive)
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # Readiness probe (model loaded)
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
        
        # Security
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
      
      # Graceful termination
      terminationGracePeriodSeconds: 30
      
      # Pod anti-affinity: spread workers across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: role
                  operator: In
                  values:
                  - worker
              topologyKey: kubernetes.io/hostname

---
# Headless service for worker discovery
apiVersion: v1
kind: Service
metadata:
  name: memopt-worker
  namespace: memopt
  labels:
    app: memopt
    role: worker
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for DNS discovery
  selector:
    app: memopt
    role: worker
  ports:
  - name: infer
    port: 9000
    targetPort: 9000
    protocol: TCP
  - name: health
    port: 8080
    targetPort: 8080
    protocol: TCP
