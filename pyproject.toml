[build-system]
requires = ["setuptools>=61.0", "wheel", "cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memopt-engine"
version = "1.3.0a1"
description = "MEMOPT — Universal Memory Fabric for AI Infrastructure. Open-sourced by Sophisticates (https://sophisticatesai.com)."
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [
    {name = "Lachu Man Basnet", email = "basnetlawservices@gmail.com"},
    {name = "Sophisticates"},
]
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
keywords = [
    "gpu", "memory", "bandwidth", "profiling", "optimization",
    "llm", "inference", "hbm", "vmm", "kv-cache", "ai-infrastructure",
    "memory-fabric", "memopt", "sophisticates",
]
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "cython>=3.0",
    "black>=23.0.0",
]
cpp = [
    "pybind11>=2.13.0",
    "scikit-build-core>=0.10.0",
    "cmake>=3.18",
    "ninja",
]
daemon = [
    "pynvml>=11.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
]
api = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "prometheus-client>=0.17.0",
]
all = [
    "pynvml>=11.0.0",
    "pyyaml>=6.0",
    "httpx>=0.24.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "prometheus-client>=0.17.0",
]

[project.urls]
Homepage      = "https://github.com/basnetlachu/memopt"
Documentation = "https://github.com/basnetlachu/memopt/tree/main/docs"
Source        = "https://github.com/basnetlachu/memopt"
Issues        = "https://github.com/basnetlachu/memopt/issues"
Changelog     = "https://github.com/basnetlachu/memopt/blob/main/CHANGELOG.md"

[project.scripts]
memopt = "memopt.cli:main"
memopt-serve = "memopt.serving.server:main"
memopt-certify = "memopt.cli.certify:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["memopt*"]
