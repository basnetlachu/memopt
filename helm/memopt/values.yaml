namespace: memopt

image:
  repository: your-registry/memopt
  tag: "1.1.0"
  pullPolicy: IfNotPresent

# GPU configuration
gpu:
  # Number of GPUs per node to allocate to memopt agent.
  # Set to 0 to use all available GPUs on each node (no limit set in K8s).
  limit: 0
  # Memory fraction per GPU (0.0 - 1.0)
  memoryFraction: 0.9

# Daemon (zero-touch scan/apply) configuration
daemon:
  # How often to scan for GPU processes (seconds)
  scanIntervalSeconds: 60
  # Sample GPU utilization for N seconds per process
  sampleSeconds: 5
  # Auto-apply optimizations without operator approval.
  # Set false (recommended) for first deployment — report-only mode.
  autoApply: false
  # Dollar cost per GPU hour (for ROI calculation)
  gpuCostPerHour: 2.50

# Dashboard
dashboard:
  enabled: true
  port: 8080

server:
  # Kept for backward compatibility
  maxConcurrentJobs: 2
  resources:
    requests:
      memory: "4Gi"
      cpu: "1000m"
    limits:
      memory: "8Gi"
      cpu: "2000m"

agent:
  pollIntervalSeconds: 15
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

storage:
  modelPVC: model-storage-pvc

service:
  type: ClusterIP
  port: 8080
