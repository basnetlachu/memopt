apiVersion: v1
kind: ConfigMap
metadata:
  name: memopt-config
  namespace: {{ .Values.namespace }}
  labels:
    app: memopt
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
data:
  # How often the agent's background thread polls NVML for GPU utilization
  AGENT_POLL_INTERVAL_SECONDS: {{ .Values.agent.pollIntervalSeconds | default 15 | quote }}

  # Maximum GPU jobs running concurrently on the server (maps to ThreadPoolExecutor max_workers)
  MAX_CONCURRENT_JOBS: {{ .Values.server.maxConcurrentJobs | default 2 | quote }}

  # Directory on the server pod where optimized model .pt files are written
  RESULTS_DIR: "/tmp/memopt_results"

  # Directory where input models are expected (mounted via modelPVC)
  MODELS_DIR: "/models"
