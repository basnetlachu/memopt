apiVersion: v1
kind: ServiceAccount
metadata:
  name: memopt-operator
  namespace: memopt

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: memopt-operator
rules:
  # Read nodes
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch"]

  # Read/write pods in the memopt namespace
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Read/write memopt CRDs
  - apiGroups: ["memopt.io"]
    resources:
      - memoptclusters
      - memoptclusters/status
      - memoptnodes
      - memoptnodes/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch

  # Read DaemonSets (to verify transport)
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: memopt-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: memopt-operator
subjects:
  - kind: ServiceAccount
    name: memopt-operator
    namespace: memopt
