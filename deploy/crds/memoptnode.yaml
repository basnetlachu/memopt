apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: memoptnodes.memopt.io
spec:
  group: memopt.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                nodeName:
                  type: string
                  description: >
                    Kubernetes node name this object
                    corresponds to.

                clusterRef:
                  type: string
                  description: >
                    Name of the MemoptCluster this node
                    belongs to.

                gpuCount:
                  type: integer
                  minimum: 0
                  default: 0

                hbmTotalGb:
                  type: number
                  minimum: 0
                  default: 0

            status:
              type: object
              properties:
                phase:
                  type: string
                  enum:
                    - Pending
                    - Certifying
                    - Ready
                    - Degraded
                    - Failed
                    - Evicted

                certificationHash:
                  type: string
                  description: >
                    Hash of the most recent silicon certificate.

                certificationTime:
                  type: string
                  format: date-time

                driftPct:
                  type: number
                  description: >
                    Current hardware drift percentage.
                    0 is healthy. Above 5% triggers alert.
                    Above 15% triggers eviction.

                hbmFreeGb:
                  type: number

                lastHeartbeat:
                  type: string
                  format: date-time

                conditions:
                  type: array
                  items:
                    type: object
                    required:
                      - type
                      - status
                      - lastTransitionTime
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string

      subresources:
        status: {}

      additionalPrinterColumns:
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Certified
          type: string
          jsonPath: .status.certificationHash
        - name: DriftPct
          type: number
          jsonPath: .status.driftPct
        - name: HBM-Free
          type: number
          jsonPath: .status.hbmFreeGb
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

  scope: Namespaced
  names:
    plural: memoptnodes
    singular: memoptnode
    kind: MemoptNode
    shortNames:
      - mn
