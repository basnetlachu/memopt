version: '3.8'

services:
  # PostgreSQL database
  postgres:
    image: postgres:15-alpine
    container_name: memopt-postgres
    environment:
      POSTGRES_DB: memopt
      POSTGRES_USER: memopt
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - memopt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memopt"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis cache
  redis:
    image: redis:7-alpine
    container_name: memopt-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - memopt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MemOpt API
  api:
    build:
      context: ..
      dockerfile: saas/Dockerfile
    container_name: memopt-api
    environment:
      - ENV=${ENV:-production}
      - DATABASE_URL=postgresql://memopt:${POSTGRES_PASSWORD:-changeme}@postgres:5432/memopt
      - REDIS_URL=redis://redis:6379/0
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - RATE_LIMIT_REVENUE_SHARE=${RATE_LIMIT_REVENUE_SHARE:-60}
      - RATE_LIMIT_ENTERPRISE=${RATE_LIMIT_ENTERPRISE:-10000}
      - TOKEN_LIMIT_REVENUE_SHARE_PER_MIN=${TOKEN_LIMIT_REVENUE_SHARE_PER_MIN:-100000}
      - TOKEN_LIMIT_ENTERPRISE_PER_MIN=${TOKEN_LIMIT_ENTERPRISE_PER_MIN:-10000000}
      - TOKEN_LIMIT_REVENUE_SHARE_PER_MONTH=${TOKEN_LIMIT_REVENUE_SHARE_PER_MONTH:-100000000}
      - TOKEN_LIMIT_ENTERPRISE_PER_MONTH=${TOKEN_LIMIT_ENTERPRISE_PER_MONTH:-999999999999}
      - MAX_CONCURRENT_REVENUE_SHARE=${MAX_CONCURRENT_REVENUE_SHARE:-5}
      - MAX_CONCURRENT_ENTERPRISE=${MAX_CONCURRENT_ENTERPRISE:-100}
      - PRICE_PER_1K_TOKENS=${PRICE_PER_1K_TOKENS:-0.002}
      - ENTERPRISE_FLAT_MONTHLY=${ENTERPRISE_FLAT_MONTHLY:-66666.67}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_JSON=${LOG_JSON:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - memopt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: memopt-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./vps/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./vps/ssl:/etc/nginx/ssl:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - api
    networks:
      - memopt-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot:latest
    container_name: memopt-certbot
    volumes:
      - certbot_www:/var/www/certbot:rw
      - certbot_conf:/etc/letsencrypt:rw
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  certbot_www:
    driver: local
  certbot_conf:
    driver: local

networks:
  memopt-network:
    driver: bridge
