apiVersion: v1
kind: Secret
metadata:
  name: {{ include "memopt.fullname" . }}-secrets
  labels:
    {{- include "memopt.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.anthropicApiKey }}
  anthropic-api-key: {{ .Values.secrets.anthropicApiKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.memoptSigningKey }}
  signing-key: {{ .Values.secrets.memoptSigningKey | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.memoptApiKey }}
  api-key: {{ .Values.secrets.memoptApiKey | b64enc | quote }}
  {{- end }}
