{{- if .Values.operator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "memopt.fullname" . }}-operator
  labels:
    {{- include "memopt.labels" . | nindent 4 }}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "memopt.fullname" . }}-operator
rules:
  - apiGroups: [""]
    resources: ["nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["memopt.io"]
    resources:
      - memoptclusters
      - memoptclusters/status
      - memoptnodes
      - memoptnodes/status
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
  - apiGroups: ["apps"]
    resources: ["daemonsets"]
    verbs: ["get", "list", "watch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "memopt.fullname" . }}-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "memopt.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "memopt.fullname" . }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
