global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "alert_rules.yml"

# Alertmanager wiring is environment-specific. Uncomment the target
# once an Alertmanager instance is deployed in the cluster.
alerting:
  alertmanagers:
    - static_configs:
        - targets: []
          # - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: memopt-serving
    static_configs:
      - targets: ['memopt-serving:8080']
    metrics_path: /metrics

  - job_name: memopt-control-plane
    static_configs:
      - targets: ['memopt-control-plane:8765']
    metrics_path: /metrics
