# MemOpt Kubernetes Deployment
# Horizontal scaling with independent GPU workers

apiVersion: v1
kind: Namespace
metadata:
  name: memopt

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: memopt-config
  namespace: memopt
data:
  # Model configuration
  MODEL_NAME: "gpt2"  # Change to your model
  OPTIMIZATION_LEVEL: "batch"
  
  # Scaling configuration
  MEMOPT_MAX_QUEUE: "5000"
  MEMOPT_WORKERS: "1"
  MEMOPT_MAX_BATCH: "32"
  MEMOPT_HEALTH_INTERVAL: "300"
  
  # Observability
  MEMOPT_ENABLE_HEALTH: "true"
  MEMOPT_ENABLE_METRICS: "true"
  PORT: "8080"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: memopt
  namespace: memopt
  labels:
    app: memopt
spec:
  # Horizontal scaling: increase replicas for more capacity
  replicas: 3
  
  selector:
    matchLabels:
      app: memopt
  
  template:
    metadata:
      labels:
        app: memopt
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    
    spec:
      containers:
      - name: memopt
        image: memopt:latest
        imagePullPolicy: IfNotPresent
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        
        env:
        # Node identity (unique per pod)
        - name: MEMOPT_NODE_ID
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        
        # Configuration from ConfigMap
        - name: MODEL_NAME
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: MODEL_NAME
        
        - name: OPTIMIZATION_LEVEL
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: OPTIMIZATION_LEVEL
        
        - name: MEMOPT_MAX_QUEUE
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: MEMOPT_MAX_QUEUE
        
        - name: MEMOPT_WORKERS
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: MEMOPT_WORKERS
        
        - name: MEMOPT_MAX_BATCH
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: MEMOPT_MAX_BATCH
        
        - name: MEMOPT_HEALTH_INTERVAL
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: MEMOPT_HEALTH_INTERVAL
        
        - name: MEMOPT_ENABLE_HEALTH
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: MEMOPT_ENABLE_HEALTH
        
        - name: MEMOPT_ENABLE_METRICS
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: MEMOPT_ENABLE_METRICS
        
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: memopt-config
              key: PORT
        
        # Resource limits (adjust for your GPU nodes)
        resources:
          requests:
            memory: "8Gi"
            cpu: "2"
            nvidia.com/gpu: "1"  # Request 1 GPU per pod
          limits:
            memory: "16Gi"
            cpu: "4"
            nvidia.com/gpu: "1"
        
        # Liveness probe (process alive)
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 3
        
        # Readiness probe (ready for traffic)
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        # Graceful shutdown
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]  # Allow time for load balancer to drain
        
        # Security
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false  # Model cache needs write access
      
      # Graceful termination
      terminationGracePeriodSeconds: 30
      
      # Pod anti-affinity: spread replicas across nodes
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - memopt
              topologyKey: kubernetes.io/hostname

---
apiVersion: v1
kind: Service
metadata:
  name: memopt
  namespace: memopt
  labels:
    app: memopt
spec:
  type: ClusterIP
  selector:
    app: memopt
  ports:
  - name: http
    port: 80
    targetPort: 8080
    protocol: TCP
  sessionAffinity: None  # No session affinity - stateless workers

---
# Horizontal Pod Autoscaler (optional)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: memopt
  namespace: memopt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: memopt
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: memopt_queue_depth
      target:
        type: AverageValue
        averageValue: "4000"  # Scale up when queue > 4000
