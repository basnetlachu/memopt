# memopt nginx — HTTP-only (no TLS)
# Used when MEMOPT_HTTPS=false (default)
# For TLS, see memopt/tls/nginx.conf.template

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Proxy all traffic to the memopt control plane
    location / {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host       $host;
        proxy_set_header   X-Real-IP  $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_connect_timeout 5s;
    }

    # Health check — no auth, no logging (k8s liveness probe)
    location /health {
        proxy_pass http://127.0.0.1:8080/health;
        access_log off;
    }

    # Prometheus metrics endpoint on port 8000
    location /metrics {
        proxy_pass http://127.0.0.1:8000/metrics;
        access_log off;
    }
}
