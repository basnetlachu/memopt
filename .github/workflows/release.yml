name: Build and Push Docker Image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to build (default: latest)'
        required: false
        default: 'latest'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: memopt/memopt

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Set up QEMU (for multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            MEMOPT_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Target amd64 (GPU servers are x86_64)
          platforms: linux/amd64

      - name: Generate deployment package
        run: |
          VERSION="${{ github.ref_name }}"
          mkdir -p dist
          # Update image tag in deployment files
          sed "s|ghcr.io/memopt/memopt:latest|ghcr.io/memopt/memopt:${VERSION}|g" \
            deployment/single-server/docker-compose.yml > dist/docker-compose.yml
          cp deployment/single-server/.env.example dist/.env.example
          cp deployment/README.md dist/README.md
          cp -r deployment/kubernetes dist/kubernetes
          tar czf "dist/memopt-deployment-${VERSION}.tar.gz" \
            -C dist \
            docker-compose.yml \
            .env.example \
            README.md \
            kubernetes/

      - name: Upload deployment package as artifact
        uses: actions/upload-artifact@v4
        with:
          name: memopt-deployment-${{ github.ref_name }}
          path: dist/memopt-deployment-*.tar.gz
          retention-days: 90

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: dist/memopt-deployment-*.tar.gz
          generate_release_notes: true
          body: |
            ## memopt ${{ github.ref_name }}

            ### Docker image
            ```
            docker pull ghcr.io/memopt/memopt:${{ github.ref_name }}
            ```

            ### Quick start
            Download the deployment package attached to this release.
            See `README.md` for full instructions.
