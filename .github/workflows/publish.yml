name: Publish to PyPI

# Fires on every tag push of the form vMAJOR.MINOR.PATCH (or
# pre-release suffixes like v1.3.0a1, v1.3.0b2, v1.3.0rc1). Matching
# the tag is intentional — we only publish what was explicitly tagged
# as a release, never every push to main.
on:
  push:
    tags:
      - 'v*'

# Only one publish run per tag at a time. If a re-push happens for the
# same tag (rare; usually a force-push), the older run is cancelled
# rather than racing to upload twice.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build source dist + wheel
        run: |
          python -m build --sdist --wheel
          ls -lh dist/

      - name: Validate with twine check
        run: python -m twine check dist/*

      - name: Upload artifacts for the publish job
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  publish-pypi:
    name: Publish to PyPI (OIDC)
    needs: build
    runs-on: ubuntu-latest
    # The matching environment must exist at
    # https://github.com/basnetlachu/memopt/settings/environments
    # named exactly "pypi". Add required reviewers there for any
    # production-grade gating.
    environment:
      name: pypi
      url: https://pypi.org/project/memopt/
    # OIDC: this job presents a short-lived JWT to PyPI; PyPI verifies
    # against the Trusted Publisher you configured at
    # https://pypi.org/manage/account/publishing/
    # No long-lived API token is stored in repo secrets.
    permissions:
      id-token: write     # required for the OIDC JWT
      contents: read

    steps:
      - name: Download dist artifacts from the build job
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No `with: password: ...` — OIDC is automatic when the
        # environment+id-token-write permissions are configured above.
