name: Build Wheels

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types: [published]

jobs:
  build-wheel:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
        cuda-version: ["12.4", "12.6"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install CUDA toolkit
        uses: Jimver/cuda-toolkit@v0.2.11
        with:
          cuda: ${{ matrix.cuda-version }}
          method: network

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install scikit-build-core pybind11 ninja build auditwheel

      - name: Build wheel
        run: |
          python -m build --wheel \
            -C cmake.args="-DCMAKE_CUDA_ARCHITECTURES=86;90;100" \
            -C cmake.args="-DCMAKE_BUILD_TYPE=Release" \
            -C cmake.args="-DMEMOPT_ENABLE_GDS=OFF" \
            -C cmake.args="-DMEMOPT_ENABLE_RDMA=OFF"

      - name: Repair wheel (manylinux)
        run: |
          auditwheel repair dist/*.whl \
            --plat manylinux_2_28_x86_64 \
            -w wheelhouse/ || cp dist/*.whl wheelhouse/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheel-py${{ matrix.python-version }}-cu${{ matrix.cuda-version }}
          path: wheelhouse/*.whl
          retention-days: 30

  publish:
    needs: build-wheel
    runs-on: ubuntu-22.04
    if: github.event_name == 'release'
    permissions:
      id-token: write
    steps:
      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
