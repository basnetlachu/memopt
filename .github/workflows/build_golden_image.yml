name: Build Golden Image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      cuda_version:
        description: "CUDA toolkit version (major.minor)"
        required: true
        default: "12.4"
      sm_targets:
        description: "CUDA SM targets (semicolon separated)"
        required: true
        default: "86;90;100"
      push_to_registry:
        description: "Push image to registry"
        type: boolean
        required: true
        default: false

# REQUIRES: GPU hardware for real CUDA compilation.
# GitHub-hosted runners have no GPU and no nvcc, so the build
# succeeds but C++ CUDA kernels fall back to Python. When Nebius
# hardware is available, point `runs-on:` to the self-hosted runner.

jobs:
  build-golden:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    env:
      CUDA_VERSION: ${{ github.event.inputs.cuda_version || '12.4' }}
      SM_TARGETS:   ${{ github.event.inputs.sm_targets || '86;90;100' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: ${{ github.event_name == 'release' || github.event.inputs.push_to_registry == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute build metadata
        id: meta
        run: |
          echo "BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "TAGS=ghcr.io/${{ github.repository }}/memopt-golden:${{ github.ref_name }},ghcr.io/${{ github.repository }}/memopt-golden:latest" >> "$GITHUB_OUTPUT"
            echo "PUSH=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERSION=dev-${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "TAGS=memopt-golden:test" >> "$GITHUB_OUTPUT"
            echo "PUSH=${{ github.event.inputs.push_to_registry || 'false' }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build golden image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.golden
          push: ${{ steps.meta.outputs.PUSH == 'true' }}
          load: ${{ steps.meta.outputs.PUSH != 'true' }}
          tags: ${{ steps.meta.outputs.TAGS }}
          build-args: |
            CUDA_VERSION=${{ env.CUDA_VERSION }}
            CUDA_ARCHITECTURES=${{ env.SM_TARGETS }}
            MEMOPT_VERSION=${{ steps.meta.outputs.VERSION }}
            GIT_COMMIT=${{ github.sha }}
            BUILD_DATE=${{ steps.meta.outputs.BUILD_DATE }}
          labels: |
            memopt.version=${{ steps.meta.outputs.VERSION }}
            memopt.git-commit=${{ github.sha }}
            memopt.build-date=${{ steps.meta.outputs.BUILD_DATE }}
            memopt.sm-targets=${{ env.SM_TARGETS }}
            memopt.cuda-version=${{ env.CUDA_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate image
        if: ${{ steps.meta.outputs.PUSH != 'true' }}
        run: |
          docker run --rm memopt-golden:test python3 -c "
          import memopt
          import os, glob
          so_files = glob.glob('/app/memopt/**/*.so', recursive=True)
          print(f'Extensions: {len(so_files)}')
          assert os.path.exists('/etc/memopt/version'), 'Missing /etc/memopt/version'
          print('Validation: PASS')
          "

      - name: Generate manifest
        run: |
          mkdir -p dist
          cat > dist/golden-image-manifest.json <<EOF
          {
            "version":      "${{ steps.meta.outputs.VERSION }}",
            "git_commit":   "${{ github.sha }}",
            "git_branch":   "${{ github.ref_name }}",
            "build_date":   "${{ steps.meta.outputs.BUILD_DATE }}",
            "cuda_version": "${{ env.CUDA_VERSION }}",
            "sm_targets":   "${{ env.SM_TARGETS }}",
            "image":        "${{ steps.meta.outputs.TAGS }}",
            "validated":    true
          }
          EOF
          cat dist/golden-image-manifest.json

      - name: Upload manifest
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: golden-image-manifest
          path: dist/golden-image-manifest.json
          retention-days: 365
